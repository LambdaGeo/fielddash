[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fielddash"
version = "0.1.0"
description = "Schema-driven dashboards for field data collection (Epicollect5)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sergio Costa, LambdaGeo / UFMA" },
    { name = "André Moura, LambdaGeo / UFMA" },
]
keywords = [
    "epicollect5",
    "fieldwork",
    "data-collection",
    "streamlit",
    "gis",
    "survey",
    "geoprocessing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "streamlit>=1.39",
    "pandas>=2.0",
    "plotly>=5.0",
    "folium>=0.15",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/LambdaGeo/fielddash"
Repository = "https://github.com/LambdaGeo/fielddash"
Documentation = "https://github.com/LambdaGeo/fielddash#readme"
"Bug Tracker" = "https://github.com/LambdaGeo/fielddash/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fielddash = "fielddash.cli:main"
geocoleta = "fielddash.cli:main"

[tool.setuptools.packages.find]
include = ["fielddash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
