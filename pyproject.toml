[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fielddash"
version = "0.1.1"
description = "Schema-driven dashboards for field data collection (Epicollect5)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sergio Souza Costa", email = "sergio.costa@ufma.br" },
    { name = "André Moura Lima" },
    { name = "Ricardo Luvizotto Santos", email = "ricardo.luvizotto@ufma.br" },
    { name = "Marianna Basso Jorge", email = "mb.jorge@ufma.br" },
]
keywords = [
    "epicollect5",
    "fieldwork",
    "data-collection",
    "streamlit",
    "gis",
    "survey",
    "geoprocessing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "streamlit>=1.39",
    "pandas>=2.0",
    "plotly>=5.0",
    "folium>=0.15",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/LambdaGeo/fielddash"
Repository = "https://github.com/LambdaGeo/fielddash"
Documentation = "https://lambdageo.github.io/fielddash/"
"Bug Tracker" = "https://github.com/LambdaGeo/fielddash/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.5,<10"]

[project.scripts]
fielddash = "fielddash.cli:main"

[tool.setuptools.packages.find]
include = ["fielddash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
